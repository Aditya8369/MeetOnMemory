name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel redundant runs for the same PR/branch — keeps only the latest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 0. CHANGE DETECTION — path filters for mixed / docs-only PRs
  # ─────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # dorny/paths-filter lists PR files via the GitHub API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      formatting: ${{ steps.filter.outputs.formatting }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
              - '.github/workflows/**'
            frontend:
              - 'client/**'
              - '.github/workflows/**'
            formatting:
              - '**/*.{js,jsx,ts,tsx,css,html,json,md,yml,yaml}'
              - '.prettierrc'
              - '.prettierrc.*'
              - 'prettier.config.*'
              - '.github/workflows/**'
            security:
              - 'server/package.json'
              - 'server/package-lock.json'
              - 'client/package.json'
              - 'client/package-lock.json'
              - '.github/workflows/**'

  # ─────────────────────────────────────────────────────────────
  # 1. CODE QUALITY — Prettier formatting only
  #    ESLint runs in Backend / Frontend Validation (no duplicate).
  # ─────────────────────────────────────────────────────────────
  code-quality:
    name: Code Quality
    needs: changes
    if: needs.changes.outputs.formatting == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history needed for diff-based prettier

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Prettier — check changed files
        run: |
          git fetch origin ${{ github.base_ref || 'main' }} --depth=1
          TARGET_BRANCH="origin/${{ github.base_ref || 'main' }}"
          CHANGED_FILES=$(git diff --name-only $TARGET_BRANCH...HEAD | grep -E '\.(js|jsx|ts|tsx|css|html|json|md|yml|yaml)$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            npx prettier --check $CHANGED_FILES
          else
            echo "No changed files to check."
          fi

  # ─────────────────────────────────────────────────────────────
  # 2. BACKEND VALIDATION — Lint, tests, coverage, startup
  # ─────────────────────────────────────────────────────────────
  backend-validation:
    name: Backend Validation
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Create minimal .env for tests
        run: |
          cat <<EOF > server/.env
          NODE_ENV=test
          JWT_SECRET=ci_test_secret
          GEMINI_API_KEY=test_key
          GEMINI_MODEL=gemini-2.5-flash
          PINECONE_API_KEY=test_key
          INDEX_NAME=meeton
          EOF

      - name: Lint
        run: npm run lint --prefix server

      - name: Run tests with coverage
        run: npm run test:ci --prefix server

      - name: Startup validation
        run: npm run test:startup --prefix server

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # 3. FRONTEND VALIDATION — Lint, tests, production build
  # ─────────────────────────────────────────────────────────────
  frontend-validation:
    name: Frontend Validation
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Lint
        run: npm run lint --prefix client

      - name: Run tests
        run: npm run test:ci --prefix client

      - name: Verify production build
        run: npm run build --prefix client

  # ─────────────────────────────────────────────────────────────
  # 4. SECURITY — npm audit (informational; does not fail the job)
  # ─────────────────────────────────────────────────────────────
  security:
    name: Security Checks
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Audit server dependencies
        run: |
          cd server
          npm audit --audit-level=high || true
        # `|| true` keeps this job informational. npm audit exits non-zero for
        # many advisory levels; the bot in 11-ci-validation ignores this check.

      - name: Audit client dependencies
        run: |
          cd client
          npm audit --audit-level=high || true

  # ─────────────────────────────────────────────────────────────
  # 5. INTEGRATION TESTS — Critical API endpoint verification
  #    Kept as a dedicated required-check signal (see docs/CI_PIPELINE.md).
  #    Backend Validation also runs this file via test:ci.
  # ─────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Create minimal .env for tests
        run: |
          cat <<EOF > server/.env
          NODE_ENV=test
          JWT_SECRET=ci_test_secret
          GEMINI_API_KEY=test_key
          GEMINI_MODEL=gemini-2.5-flash
          PINECONE_API_KEY=test_key
          INDEX_NAME=meeton
          EOF

      - name: Run integration tests
        run: |
          cd server
          node --experimental-vm-modules node_modules/jest/bin/jest.js \
            --forceExit --ci \
            tests/integration.test.js
